name: Validate Chip 5011 maintenance

on:
  push:
    branches:
      - maintenance/chip-5011-validation-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the review fix to current upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('src/components/Chip/Chip.tsx')
          source = path.read_text()
          start = source.index('      <TouchableRipple\n')
          end = source.index('      </TouchableRipple>', start) + len('      </TouchableRipple>')
          block = source[start:end]
          opening, children = block.split('      >\n', 1)
          children = children.rsplit('      </TouchableRipple>', 1)[0]
          content = textwrap.indent(textwrap.dedent(children).strip(), '    ')
          declaration = '  const chipContent = (\n' + content + '\n  );\n\n'
          declaration += "  const accessibilityProps = {\n    'aria-label': ariaLabel,\n    role: role ?? (hasPassedTouchHandler ? 'button' : undefined),\n    'aria-selected': selected,\n    'aria-disabled': disabled,\n  } as const;\n\n"
          replacement = '''      {hasPassedTouchHandler ? (
                  <TouchableRipple
                    borderless
                    background={background}
                    style={[{ borderRadius }, styles.touchable]}
                    onPress={onPress}
                    onLongPress={onLongPress}
                    onPressIn={handlePressIn}
                    onPressOut={handlePressOut}
                    delayLongPress={delayLongPress}
                    disabled={disabled}
                    {...accessibilityProps}
                    testID={testID}
                    theme={theme}
                    hitSlop={hitSlop}
                  >
                    {chipContent}
                  </TouchableRipple>
                ) : (
                  <View
                    accessible
                    style={[{ borderRadius }, styles.touchable]}
                    {...accessibilityProps}
                    testID={testID}
                  >
                    {chipContent}
                  </View>
                )}'''
          source = source[:start] + replacement + source[end:]
          assert source.count("  role = 'button',") == 1
          source = source.replace("  role = 'button',", '  role,')
          marker = '  return (\n    <Surface\n'
          assert source.count(marker) == 1
          source = source.replace(marker, declaration + marker)
          path.write_text(source)

          path = Path('src/components/__tests__/Chip.test.tsx')
          source = path.read_text()
          old = "it('renders disabled chip if there is no touch handler passed', async () => {\n  await render(<Chip testID=\"disabled-chip\">Disabled chip</Chip>);\n\n  expect(screen.getByTestId('disabled-chip')).toBeDisabled();\n});"
          new = "it('does not mark informational chip disabled', async () => {\n  await render(<Chip testID=\"informational-chip\">Informational chip</Chip>);\n\n  expect(screen.getByTestId('informational-chip')).not.toBeDisabled();\n});"
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY
      - name: Install the lockfile-pinned workspace
        run: npx --yes @yarnpkg/cli-dist@4.9.1 install --immutable
      - name: Format changed source
        run: npx --yes @yarnpkg/cli-dist@4.9.1 prettier --write src/components/Chip/Chip.tsx src/components/__tests__/Chip.test.tsx
      - name: Regenerate the focused snapshots
        run: npx --yes @yarnpkg/cli-dist@4.9.1 test src/components/__tests__/Chip.test.tsx --runInBand --updateSnapshot
      - name: Verify the focused suite without updating snapshots
        run: npx --yes @yarnpkg/cli-dist@4.9.1 test src/components/__tests__/Chip.test.tsx --runInBand
      - name: Lint changed source
        run: npx --yes @yarnpkg/cli-dist@4.9.1 eslint src/components/Chip/Chip.tsx src/components/__tests__/Chip.test.tsx
      - name: Type check
        run: npx --yes @yarnpkg/cli-dist@4.9.1 typecheck
      - name: Check patch and collect results
        if: always()
        run: |
          git diff --check
          git diff -- src/components/Chip/Chip.tsx src/components/__tests__/Chip.test.tsx src/components/__tests__/__snapshots__/Chip.test.tsx.snap > chip-5011.patch
      - name: Upload candidate and validation diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chip-5011-validated-candidate
          path: |
            src/components/Chip/Chip.tsx
            src/components/__tests__/Chip.test.tsx
            src/components/__tests__/__snapshots__/Chip.test.tsx.snap
            chip-5011.patch
          retention-days: 7
