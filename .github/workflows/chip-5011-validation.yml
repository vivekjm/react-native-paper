name: Publish validated Chip 5011 candidate

on:
  push:
    branches:
      - maintenance/chip-5011-validation-20260906
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chip-5011-validated-candidate
          run-id: 33989484303
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify artifact hashes and publish only a candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ['GH_REPOSITORY']
          assert repo == 'vivekjm/react-native-paper'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          def api(path, data=None):
              request = Request(
                  'https://api.github.com/repos/' + repo + '/' + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers=headers,
                  method='GET' if data is None else 'POST',
              )
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = api('actions/runs/33989484303')
          assert run['conclusion'] == 'success'
          assert run['head_sha'] == '009842875dbe4c6dad59eb7afdce541e37e121e6'
          expected = {
              'src/components/Chip/Chip.tsx': '451a0c21c2737900e199d2ccf595ea37e294b558',
              'src/components/__tests__/Chip.test.tsx': 'f417ac021c7e26d317ba151215257728bd4c2d66',
              'src/components/__tests__/__snapshots__/Chip.test.tsx.snap': '91cf30590fcceccf3a225663dd142c74a4be6aff',
          }
          entries = []
          for path, expected_sha in expected.items():
              content = (Path('candidate') / path).read_bytes()
              digest = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              assert digest == expected_sha, path
              blob = api('git/blobs', {
                  'content': base64.b64encode(content).decode(),
                  'encoding': 'base64',
              })
              assert blob['sha'] == expected_sha
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = api('git/trees', {
              'base_tree': '6a5a52ed0e7b6358217b772f017fdc9204062767',
              'tree': entries,
          })
          commit = api('git/commits', {
              'message': 'fix: preserve non-interactive Chip accessibility after upstream refactor',
              'tree': tree['sha'],
              'parents': [
                  '893e14842eec38d63530d064ed0d437ffd90f5b8',
                  '98e4a8484f2947b4414be39d528cb82838191c13',
              ],
          })
          branch = 'maintenance/chip-5011-validated-20260906'
          api('git/refs', {'ref': 'refs/heads/' + branch, 'sha': commit['sha']})
          print(json.dumps({'candidate_branch': branch, 'commit_sha': commit['sha'], 'tree_sha': tree['sha'], 'files': expected}, indent=2))
          PY
